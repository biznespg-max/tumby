<text x="888" y="602" font-size="15"><tspan font-weight="700">V7</tspan>  Дно крыла — 184.5 × 364 мм × 2</text>
<text x="860" y="652" font-size="14" fill="#555">Было: передняя полоса дна V6 и стенка V5 закрывали вырез спереди,</text>
<text x="860" y="674" font-size="14" fill="#555">задняя стенка из двух половинок 184,5 мм — ViyarPro не сверлит &lt; 200 мм.</text>
<text x="860" y="696" font-size="14" fill="#555">Стало: вырез от передней стенки V2 до зада, V5 и V6 убраны,</text>
