# Умывальники Adamant Quanto (мебельные, накладные, искусственный камень).
# Размеры — с чертежей производителя (vencon.ua, «Габаритні розміри»).
brand: Adamant
series: Quanto
code: Q                    # буква умывальника в артикуле тумбы (TL-Q80)

# Общее для всех размеров серии
depth: 447                 # глубина умывальника
height: 140                # высота
bowl_depth: 285            # глубина чаши (спереди назад)
bowl_drop: 115             # чаша ниже верха умывальника
# Центр слива от заднего края умывальника. Оценка по чертежу — ИЗМЕРИТЬ на образце.
drain_from_back: 265

sizes:
  60:  {width: 600,  bowl_width: 450, ean: "4824296206101"}
  70:  {width: 700,  bowl_width: 550, ean: "4824296206201"}
  80:  {width: 800,  bowl_width: 650, ean: "4824296206301"}
  100: {width: 1000, bowl_width: 800, ean: "4824296107201"}
# Есть ещё Quanto 90 (900 x 447 x 140, чаша 700, EAN 4824296107101): корпус 890 мм —
# по правилу ВіЯр для Muller (не шире 2 x L = 800) нужен Hettich, как у TL-Q100.
