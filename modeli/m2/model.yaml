# Модель 2 (T2) — подвесная, высота 600, верхний ящик меньше, нижний больше.
# Предварительно (21.11.2026): корпус — МДФ 16 мм влагостойкий под покраску, белый; короба — ДСП белое
# влагостойкое; фасады — Маура 19 мм, белые. Умывальники Quanto / Cers / Flat 60.
# Все размеры в миллиметрах.

code: T2
name: "Модель 2"
title: "Тумба подвесная Модель 2 {size} под {brand} {series} {size}"

# Тумба считается под Quanto; Cers и Flat встают на неё же (проверяется в тестах).
izdeliya:
  - umyvalnik: adamant-quanto
    sizes: [60]
compatible: [adamant-cers, adamant-flat]

# --- Корпус ------------------------------------------------------------------
width_from_sink: -10
depth_from_sink: -3
height: 600
floor: false
t: 16                    # МДФ влагостойкий 16 мм под покраску (белый)
t_box: 18                # короба ящиков: ДСП белое влагостойкое 18 мм

front_rail_h: 80
rear_top_rail_h: 120
rear_bottom_rail_h: 100

# --- Фасады (Маура) — ручки накладные (22.11.2026: фрезерованную проходную ручку убрали) ------------------------------------------------------
facade_t: 19
facade_style: "фарбований МДФ ViyarFronts, фрезерування «Маура» (тонка рамка ~20 мм, тільки 19 мм), білий, мат; без фрезерованої ручки"
facade_color: "белый (корпус и фасады)"
facade_side_gap: 2
facade_top_gap: 2
facade_mid_gap: 3
facade_bottom_gap: 1
handles: "Ручки накладні (модель уточнити: серія Smart / Cosma, ВіЯр), міжцентрова 160 — по центру фасаду, зверху"
facade_bottom_h: 308     # нижний фасад; верхний = остаток (286)

drawer_bottom_box_h: 200
drawer_top_box_h: 120     # под чашей умывальника

# --- Ящики: Häfele Matrix Runner UM A30, полное выдвижение, доводчик, клипсы 3D ---
# Короба из ДСП 18 мм (у Matrix боковина ящика до 19 мм). Внутренняя ширина короба =
# внутр. ширина корпуса - 49 (по схеме продавца для арт. 433.03.28x; у Häfele встречается и -42 —
# СВЕРИТЬ с инструкцией в коробке). Длина короба = NL = 400, мин. глубина корпуса 418.
runner_name: "Направляючі прихованого монтажу Häfele Matrix Runner UM A30, повний висув, з доводчиком і кліпсами 3D, 30 кг, NL=400 мм (арт. Häfele 433.03.284; комплект: пара напрямних + пара кліпс)"
runner_code: "Häfele 433.03.284 (код ВіЯр уточнити)"
runner_nl: 400
runner_min_depth: 418     # мин. внутренняя глубина корпуса для NL=400
runner_max_width: 1000    # ПРОВЕРИТЬ макс. ширину ящика для 30 кг у Häfele (у TL/TG-100 корпус 990)
runner_two_l_rule: false
runner_extra: ""
drawer_len: 400           # = NL
drawer_inner_deduct: 49
rear_bottom_rail_lift: 50 # задняя нижняя царга K5 поднята на 50 мм: под ней задние концы направляющих
drawer_bottom_recess: 13

# --- Сифон ----------------------------------------------------------------------
siphon_clearance: 50
u_width: 200

# --- Присадка: стыки -----------------------------------------------------------
# Соединения на минификсах (generator/joints.py): шток Ø5×11 в пласти, Ø8×34 в торце,
# эксцентрик Ø15 на 24 мм от торца — всё глухое и изнутри. conf_* - разметка стыков.
joint: minifix
conf_face_d: 7
conf_edge_d: 5
conf_edge_depth: 35

# --- Материалы ВіЯр -----------------------------------------------------------
sheets:
  corpus:
    name: "МДФ-плита шліфована вологостійка Коростень 2800х2070х16 мм (код 55816)"
    length: 2800
    width: 2070
    thickness: 16
  box:
    name: "ДСП лам. Kronospan 8100 SM Білий перламутровий вологостійке Р3 2800х2070х18 мм (код 178719, складська програма ВіЯр)"
    length: 2800
    width: 2070
    thickness: 18
bands:
  B2:  {name: "Кромка ABS REHAU 77039 Білий платиновий SM 23x2 мм (ВіЯр 93204, видимые торцы)", thickness: 2, width: 23}
  B08: {name: "Кромка ABS REHAU 77039 Білий платиновий SM 23x0,8 мм (ВіЯр 12183, остальные торцы)", thickness: 0.8, width: 23}
