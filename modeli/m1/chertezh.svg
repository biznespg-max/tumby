<text x="40.0" y="582.0" font-size="11" text-anchor="start" fill="#333" font-weight="normal">Модель 1 (T1-Q60) — по типу Mirater «Естель» 60. Корпус МДФ 16, белый; фасады МДФ 19 Урбан, белые.</text>
<text x="40.0" y="599.0" font-size="11" text-anchor="start" fill="#333" font-weight="normal">F0 — неподвижная царга-фасад 100 мм, сама связывает боковины (4 минификса), внутренней царги нет; F1, F2 — ящики.</text>
<text x="40.0" y="616.0" font-size="11" text-anchor="start" fill="#333" font-weight="normal">Ручки Ferro Fiori M 0734.320 чёрный браш (ВіЯр 191336), межосевое 320, по центру, ось 60 мм от верха фасада.</text>
<text x="40.0" y="633.0" font-size="11" text-anchor="start" fill="#333" font-weight="normal">Ножки Ferro Fiori PL 737 h=120, чёрные (ВіЯр 218885), 4 шт., центр ~40 мм от боковин.</text>
<text x="40.0" y="650.0" font-size="11" text-anchor="start" fill="#333" font-weight="normal">Фасады МДФ 19, фрезеровка Урбан (ViyarFronts): пунктир — рамка ≈27 мм от торца, на всех трёх фасадах.</text>
