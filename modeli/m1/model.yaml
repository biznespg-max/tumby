# Модель 1 (T1) — напольная, по типу Mirater «Естель» 60 (арт. 8343): сверху неподвижная фальш-панель
# (царга-фасад) 100 мм, под ней два одинаковых ящика. Замеры Естель с витрины: царга 100, ящики по 305.
# Высота: ножки 120 + корпус 710 = 830, с накладным умывальником (30 мм) — 860. (22.11.2026)
# Корпус — МДФ 16 мм влагостойкий под покраску, белый; короба — ДСП белое влагостойкое;
# фасады — Урбан 19 мм, белые (решили 22.11.2026 вместо Коррадо: Коррадо не делается на царге 100). Ручки и ножки — Ferro Fiori, чёрные. Умывальники Quanto / Cers / Flat 60.
# Визуал, чертёж общего вида и внутреннее устройство: modeli/m1/vizual.png, chertezh.png, vnutri.png (скрипты vizual.py, vnutri.py).
# Все размеры в миллиметрах.

code: T1
name: "Модель 1"
title: "Тумба напольная Модель 1 {size} под {brand} {series} {size}"

# Тумба считается под Quanto; Cers и Flat встают на неё же (проверяется в тестах).
izdeliya:
  - umyvalnik: adamant-quanto
    sizes: [60]
compatible: [adamant-cers, adamant-flat]

# --- Корпус ------------------------------------------------------------------
width_from_sink: -10
depth_from_sink: -3
height: 710               # корпус без ножек; с ножками 830, с умывальником 860
floor: true
legs: "Ніжка меблева Ferro Fiori PL 737, h=120 мм, max 500 кг, чорний (ВіЯр 218885)"
handles: "Ручка Ferro Fiori M 0734.160 чорний браш, міжцентрова 160 мм, накладна (ВіЯр 191333) — по центру фасаду, вісь 60 мм від верху (нижче рамки Урбан)"
t: 16                    # МДФ влагостойкий 16 мм под покраску (белый)
t_box: 18                # короба ящиков: ДСП белое влагостойкое 18 мм

front_rail_h: 100        # K3 нет (f0_structural); значение используется только как зона над верхним ящиком
rear_top_rail_h: 120
rear_bottom_rail_h: 100

# --- Фасады (Урбан): царга F0 100 + два ящика по 302 (у Естель 305, у нас ножки выше) ---
facade_t: 19
facade_style: "фарбований МДФ ViyarFronts, фрезерування «Урбан» (вузька рамка ≈27 мм, центр фрези 9,5 мм від торця, скіс 77°; товщина 19/22, взято 19), білий, мат; мін. фасад 70×260"
facade_color: "белый (корпус и фасады)"
facade_side_gap: 2
facade_top_gap: 0        # фальш-панель вровень с верхом корпуса (под умывальником)
facade_mid_gap: 3
facade_bottom_gap: 0     # нижний фасад вровень с низом корпуса
facade_panel_h: 100      # F0 — неподвижная царга-фасад, Урбан (мин. высота 70 — проходит)
mid_rail: {y: 300, depth: 100}   # K3 лежит между ящиками (стык фасадов 302–305), 558×100; связывает боковины посередине (22.11.2026)
f0_structural: true      # как у Mirater «Естель»: F0 сама связывает боковины на минификсах (шток в изнанке F0), внутренней царги K3 нет
facade_bottom_h: 302     # ящики поровну: 100 + 3 + 302 + 3 + 302 = 710

drawer_bottom_box_h: 270     # верх короба 289 — 11 мм до средней царги K3
drawer_top_box_h: 200     # под чашей умывальника

# --- Ящики: Häfele Matrix Runner UM A30, полное выдвижение, доводчик, клипсы 3D ---
# Короба из ДСП 18 мм (у Matrix боковина ящика до 19 мм). Внутренняя ширина короба =
# внутр. ширина корпуса - 49 (по схеме продавца для арт. 433.03.28x; у Häfele встречается и -42 —
# СВЕРИТЬ с инструкцией в коробке). Длина короба = NL = 400, мин. глубина корпуса 418.
runner_name: "Направляючі прихованого монтажу Häfele Matrix Runner UM A30, повний висув, з доводчиком і кліпсами 3D, 30 кг, NL=400 мм (арт. Häfele 433.03.284; комплект: пара напрямних + пара кліпс)"
runner_code: "Häfele 433.03.284 (код ВіЯр уточнити)"
runner_nl: 400
runner_min_depth: 418     # мин. внутренняя глубина корпуса для NL=400
runner_max_width: 1000    # ПРОВЕРИТЬ макс. ширину ящика для 30 кг у Häfele (у TL/TG-100 корпус 990)
runner_two_l_rule: false
runner_extra: ""
drawer_len: 400           # = NL
drawer_inner_deduct: 49
rear_bottom_rail_lift: 50 # задняя нижняя царга K5 поднята на 50 мм: под ней задние концы направляющих
drawer_bottom_recess: 13

# --- Сифон ----------------------------------------------------------------------
siphon_clearance: 50
u_width: 200

# --- Присадка: стыки -----------------------------------------------------------
# Соединения на минификсах (generator/joints.py): шток Ø5×11 в пласти, Ø8×34 в торце,
# эксцентрик Ø15 на 24 мм от торца — всё глухое и изнутри. conf_* - разметка стыков.
joint: minifix
conf_face_d: 7
conf_edge_d: 5
conf_edge_depth: 35

# --- Материалы ВіЯр -----------------------------------------------------------
sheets:
  corpus:
    name: "МДФ-плита шліфована вологостійка Коростень 2800х2070х16 мм (код 55816)"
    length: 2800
    width: 2070
    thickness: 16
  box:
    name: "ДСП лам. Kronospan 8100 SM Білий перламутровий вологостійке Р3 2800х2070х18 мм (код 178719, складська програма ВіЯр)"
    length: 2800
    width: 2070
    thickness: 18
bands:
  B2:  {name: "Кромка ABS REHAU 77039 Білий платиновий SM 23x2 мм (ВіЯр 93204, видимые торцы)", thickness: 2, width: 23}
  B08: {name: "Кромка ABS REHAU 77039 Білий платиновий SM 23x0,8 мм (ВіЯр 12183, остальные торцы)", thickness: 0.8, width: 23}
