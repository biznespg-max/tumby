# Серия TL «Line» — подвесная тумба с двумя ящиками под мебельный умывальник.
# Фасады «Рамка з лініями», корпус и фасады крашеные МДФ.
# Все размеры в миллиметрах.

code: TL
name: Line
title: "Тумба подвесная Line {size} под {brand} {series} {size}"

# Какие изделия собирать: умывальник (файл из umyvalniki/) и размеры.
# Артикул = TL-<код умывальника><размер>, например TL-Q80.
izdeliya:
  - umyvalnik: adamant-quanto
    sizes: [60, 70, 80]
  # TL-Q90 и TL-Q100: корпус 890 / 990 мм. Для Muller L=400 ВіЯр допускает модуль
  # не шире 2 x L = 800 мм (и не шире 900), поэтому ящики на Hettich Actro YOU
  # (ширина до 1200 мм), короба из ДСП 16 мм (боковины ящика у Actro YOU не толще 16 мм).
  - umyvalnik: adamant-quanto
    sizes: [90, 100]
    override:
      runner_name: "Направляючі Actro YOU L=400 (40 кг) з Silent System, ліва 9318175 + права 9318176 Hettich (або к-т V2.0, код 180735)"
      runner_code: "178796 + 178797"
      runner_extra: "Комплект фіксаторів Actro YOU для дерев'яних ящиків (9320320) Hettich, код 179744 — 2 компл."
      runner_max_width: 1200
      runner_two_l_rule: false
      t_box: 16
      # Hettich, монтажная ширина EB21, боковина 16 мм: наружная ширина короба = LW - 10,
      # внутренняя = LW - 42. ПРОВЕРИТЬ по инструкции Actro YOU.
      drawer_inner_deduct: 42
      sheets:
        box:
          name: "ДСП лам. Kronospan 5981 BS Кашемір 2800х2070х16 мм (уточнить код и наличие в ВіЯр)"
          length: 2800
          width: 2070
          thickness: 16

# --- Корпус ------------------------------------------------------------------
# Ширина корпуса = ширина умывальника - 10 (край раковины выступает на 5 мм с каждой
# стороны, вода стекает мимо торцов). Глубина = глубина умывальника - фасад - 3.
width_from_sink: -10
depth_from_sink: -3
height: 650
t: 19                    # МДФ влагостойкий 19 мм под покраску
t_box: 18                # короба ящиков: ДСП влагостойкое 18 мм

front_rail_depth: 100    # передняя верхняя царга (лежит плашмя под умывальником)
rear_top_rail_h: 120     # задняя верхняя царга (через неё тумба вешается на стену)
rear_bottom_rail_h: 100  # задняя нижняя царга

# --- Фасады (заказываются отдельно, ViyarFronts) ------------------------------
facade_t: 19
facade_style: "фарбований МДФ ViyarFronts, фрезерування «Рамка з лініями» (Тип 1), покриття мат"
facade_color: "NCS S 3010-Y50R (корпус и фасады одним цветом)"
facade_side_gap: 2
facade_top_gap: 2
facade_mid_gap: 3
facade_bottom_gap: 1

# --- Ящики: Muller Profi Line 18 мм, 3D, полное выдвижение, доводчик -----------
runner_name: "Направляючі прихованого монтажу SC L=400 Muller Profi Line 18 мм, 3D, повне висування, з дотягувачем"
runner_code: "42135"
runner_nl: 400
runner_max_width: 900     # макс. ширина модуля по ВіЯр
runner_two_l_rule: true   # модуль не шире 2 x L (рекомендация ВіЯр для Muller)
runner_extra: ""
drawer_len: 390           # L - 10
drawer_inner_deduct: 49   # внутр. ширина короба = внутр. ширина корпуса - 49 (ПРОВЕРИТЬ по схеме Muller)
drawer_bottom_recess: 13
drawer_bottom_box_h: 200
drawer_top_box_h: 130     # под чашей умывальника

# --- Сифон ----------------------------------------------------------------------
siphon_clearance: 50
u_width: 200

# --- Присадка: конфирмат 7x50 -------------------------------------------------
conf_face_d: 7
conf_edge_d: 5
conf_edge_depth: 35

# --- Материалы ВіЯр -----------------------------------------------------------
sheets:
  corpus:
    name: "МДФ-плита шліфована вологостійка Коростень 2800х2070х19 мм (код 55814)"
    length: 2800
    width: 2070
    thickness: 19
  box:
    name: "ДСП лам. Kronospan 5981 BS Кашемір вологостійке Р3 2800х2070х18 мм (код 178718)"
    length: 2800
    width: 2070
    thickness: 18
bands:
  B2:  {name: "Кромка ABS 22x2 мм в цвет Кашемір 5981 (видимые торцы)", thickness: 2, width: 22}
  B08: {name: "Кромка ABS 22x0,8 мм в цвет Кашемір 5981 (остальные торцы)", thickness: 0.8, width: 22}
