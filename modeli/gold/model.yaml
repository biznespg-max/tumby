# Серия TG «Gold» — подвесная тумба с двумя ящиками под мебельный умывальник.
# Конструкция как у TL «Line», но фасады вкладные (вровень с боковинами, торцы корпуса видны).
# Боковины, царги и фасады — МДФ Niemann Acrylux-MAT Античне золото 8859 (односторонняя:
# декор снаружи, изнанка белая), дно — белое влагостойкое ДСП. Вся кромка — на PUR-клей.
# Короба ящиков — ДСП Kronospan 7045 Шампань. Фасады гладкие, без ручек.
# Все размеры в миллиметрах.

code: TG
name: Gold
title: "Тумба подвесная Gold {size} под {brand} {series} {size}"

# Какие изделия собирать: умывальник (файл из umyvalniki/) и размеры.
# Артикул = TG-<код умывальника><размер>, например TG-Q80.
izdeliya:
  - umyvalnik: adamant-quanto
    sizes: [60, 70, 80, 90, 100]

# --- Корпус ------------------------------------------------------------------
# Ширина корпуса = ширина умывальника - 10 (край раковины выступает на 5 мм с каждой
# стороны, вода стекает мимо торцов). Глубина = глубина умывальника - фасад - 3.
width_from_sink: -10
depth_from_sink: -3
height: 650
t: 18                    # МДФ Acrylux 18 мм, односторонний
t_box: 18                # короба ящиков: ДСП влагостойкое 18 мм

front_rail_h: 80         # передняя верхняя царга: стоит на ребре заподлицо с передом,
                         # занимает 19 мм в глубину и не мешает чаше умывальника
rear_top_rail_h: 120     # задняя верхняя царга (через неё тумба вешается на стену)
rear_bottom_rail_h: 100  # задняя нижняя царга

# --- Фасады (заказываются отдельно, ViyarFronts) ------------------------------
facade_t: 18
facade_style: "МДФ Niemann Acrylux-MAT (AFP) PREMIUM Античне золото 8859, вкладные (вровень с боковинами), гладкие, без ручек и вырезов, кромка ABS 1 мм в цвет по 4 сторонам на PUR-клей"
facade_color: "Античне золото 8859 (корпус и фасады одним материалом)"
facade_side_gap: 2
facade_top_gap: 2
facade_mid_gap: 3
facade_bottom_gap: 1

# --- Ящики: Häfele Matrix Runner UM A30, полное выдвижение, доводчик, клипсы 3D ---
# Короба из ДСП 18 мм (у Matrix боковина ящика до 19 мм). Внутренняя ширина короба =
# внутр. ширина корпуса - 49 (по схеме продавца для арт. 433.03.28x; у Häfele встречается и -42 —
# СВЕРИТЬ с инструкцией в коробке). Длина короба = NL = 400, мин. глубина корпуса 418.
runner_name: "Направляючі прихованого монтажу Häfele Matrix Runner UM A30, повний висув, з доводчиком і кліпсами 3D, 30 кг, NL=400 мм (арт. Häfele 433.03.284; комплект: пара напрямних + пара кліпс)"
runner_code: "Häfele 433.03.284 (код ВіЯр уточнити)"
runner_nl: 400
runner_min_depth: 418     # мин. внутренняя глубина корпуса для NL=400
runner_max_width: 1000    # ПРОВЕРИТЬ макс. ширину ящика для 30 кг у Häfele (у TL/TG-100 корпус 990)
runner_two_l_rule: false
runner_extra: ""
drawer_len: 400           # = NL
drawer_inner_deduct: 49
rear_bottom_rail_lift: 50 # задняя нижняя царга K5 поднята на 50 мм: под ней задние концы направляющих
drawer_bottom_recess: 13
drawer_bottom_box_h: 200
drawer_top_box_h: 130     # под чашей умывальника

# --- Сифон ----------------------------------------------------------------------
siphon_clearance: 50
u_width: 200

# --- Присадка: стыки -----------------------------------------------------------
# Соединения на минификсах (generator/joints.py): шток Ø5×11 в пласти, Ø8×34 в торце,
# эксцентрик Ø15 на 24 мм от торца — всё глухое и изнутри. conf_* - разметка стыков.
joint: minifix
conf_face_d: 7
conf_edge_d: 5
conf_edge_depth: 35

# --- Материалы ВіЯр -----------------------------------------------------------
facade_inset: true        # фасады вкладные: между боковинами, вровень с их передними торцами
handles: ""               # фасады гладкие, без ручек и вырезов (ручки - позже)
one_sided: true           # декор с одной стороны: боковины зеркальные, лицо наружу
facades_in_cut: true      # фасады режутся из того же листа и входят в файл ViyarPro
corpus_band: BG           # все торцы корпуса и фасадов в кромке
bottom_material: bottom   # дно - из белого влагостойкого ДСП
bottom_band: BW
sheets:
  corpus:
    title: "Корпус и фасады — МДФ Acrylux, односторонний"
    name: "Панель МДФ NIEMANN 8859HM Acrylux-MAT (AFP) PREMIUM Античне золото \\ Білий РР 2800х1300х18мм (код 235316)"
    length: 2800
    width: 1300
    thickness: 18
  bottom:
    title: "Дно — ДСП белое влагостойкое"
    name: "ДСП лам. Kronospan 8685 BS Білий Сніг вологостійке Р3 2800х2070х18 мм (код 205550)"
    length: 2800
    width: 2070
    thickness: 18
  box:
    title: "Короба ящиков — ДСП"
    name: "ДСП Kronospan 7045 SU Шампань/Сатин 2800x2070x18 мм (код 31583)"
    length: 2800
    width: 2070
    thickness: 18
bands:
  BG:  {name: "8859HM Крайка ABS Античне золото 23х1мм NIEMANN матова, код 186180 (корпус и фасады)", thickness: 1, width: 23}
  BW:  {name: "Крайка ABS Білий 23х0,8мм REHAU 11372, код 88169 (дно; подобрать в тон Kronospan 8685)", thickness: 0.8, width: 23}
  B2:  {name: "94564 Крайка ABS Шампань 23х2мм REHAU, код 14448 (видимые торцы коробов)", thickness: 2, width: 23}
  B08: {name: "94564 Крайка ABS Шампань 23х0,8мм REHAU, код 87208 (остальные торцы коробов)", thickness: 0.8, width: 23}

corpus_notes:
  - "**Кромка на PUR-клей — на всех торцах всех деталей** (корпус, фасады, дно, короба). МДФ Acrylux **не влагостойкий**, PUR-шов защищает торцы от воды. В ViyarPro при заказе выбрать крайкування ПУР (для 8859 — ПУР металізованою крайкою, если ВіЯр так её считает)."
  - "Материал **односторонний** (изнанка белая): боковины K1Л/K1П — декором наружу (они зеркальные), фасады — наружу. Текстура «зліва направо» — у всех деталей вдоль длины (горизонтально)."
  - "**Дно K2** — белое влагостойкое ДСП, стоит за фасадами (отступ 18 мм). **Фасады вкладные**: стоят между боковинами вровень с их передними торцами, по бокам видна золотая кромка торцов боковин."
assembly_step0: "0. Декор (золото) — наружу. Все отверстия под минификсы — с внутренней (белой) стороны, снаружи боковины чистые."
