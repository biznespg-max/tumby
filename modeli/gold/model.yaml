# Серия TG «Gold» — подвесная тумба с двумя ящиками под мебельный умывальник.
# Конструкция как у TL «Line». Корпус и фасады — МДФ Niemann Acrylux-MAT Античне золото 8859
# (односторонняя: декор снаружи, изнанка белая), все торцы в кромке ABS в цвет.
# Короба ящиков — ДСП Kronospan 7045 Шампань.
# Все размеры в миллиметрах.

code: TG
name: Gold
title: "Тумба подвесная Gold {size} под {brand} {series} {size}"

# Какие изделия собирать: умывальник (файл из umyvalniki/) и размеры.
# Артикул = TG-<код умывальника><размер>, например TG-Q80.
izdeliya:
  - umyvalnik: adamant-quanto
    sizes: [60, 70, 80]
  # TL-Q90 и TL-Q100: корпус 890 / 990 мм. Для Muller L=400 ВіЯр допускает модуль
  # не шире 2 x L = 800 мм (и не шире 900), поэтому ящики на Hettich Actro YOU
  # (ширина до 1200 мм), короба из ДСП 16 мм (боковины ящика у Actro YOU не толще 16 мм).
  - umyvalnik: adamant-quanto
    sizes: [90, 100]
    override:
      runner_name: "Направляючі Actro YOU L=400 (40 кг) з Silent System, ліва 9318175 + права 9318176 Hettich (або к-т V2.0, код 180735)"
      runner_code: "178796 + 178797"
      runner_extra: "Комплект фіксаторів Actro YOU для дерев'яних ящиків (9320320) Hettich, код 179744 — 2 компл."
      runner_max_width: 1200
      runner_two_l_rule: false
      t_box: 16
      # Hettich, монтажная ширина EB21, боковина 16 мм: наружная ширина короба = LW - 10,
      # внутренняя = LW - 42. ПРОВЕРИТЬ по инструкции Actro YOU.
      drawer_inner_deduct: 42
      sheets:
        box:
          name: "ДСП Kronospan 7045 SU Шампань/Сатин 2800x2070x16 мм (код 31930, «скоро у продажу» — уточнить; иначе белый Kronospan 0110 SM 16 мм, код 23724)"
          length: 2800
          width: 2070
          thickness: 16

# --- Корпус ------------------------------------------------------------------
# Ширина корпуса = ширина умывальника - 10 (край раковины выступает на 5 мм с каждой
# стороны, вода стекает мимо торцов). Глубина = глубина умывальника - фасад - 3.
width_from_sink: -10
depth_from_sink: -3
height: 650
t: 18                    # МДФ Acrylux 18 мм, односторонний
t_box: 18                # короба ящиков: ДСП влагостойкое 18 мм

front_rail_h: 80         # передняя верхняя царга: стоит на ребре заподлицо с передом,
                         # занимает 19 мм в глубину и не мешает чаше умывальника
rear_top_rail_h: 120     # задняя верхняя царга (через неё тумба вешается на стену)
rear_bottom_rail_h: 100  # задняя нижняя царга

# --- Фасады (заказываются отдельно, ViyarFronts) ------------------------------
facade_t: 18
facade_style: "МДФ Niemann Acrylux-MAT (AFP) PREMIUM Античне золото 8859, гладкие, кромка ABS 1 мм в цвет по 4 сторонам"
facade_color: "Античне золото 8859 (корпус и фасады одним материалом)"
facade_side_gap: 2
facade_top_gap: 2
facade_mid_gap: 3
facade_bottom_gap: 1

# --- Ящики: Muller Profi Line 18 мм, 3D, полное выдвижение, доводчик -----------
runner_name: "Направляючі прихованого монтажу SC L=400 Muller Profi Line 18 мм, 3D, повне висування, з дотягувачем"
runner_code: "42135"
runner_nl: 400
runner_max_width: 900     # макс. ширина модуля по ВіЯр
runner_two_l_rule: true   # модуль не шире 2 x L (рекомендация ВіЯр для Muller)
runner_extra: ""
drawer_len: 390           # L - 10
drawer_inner_deduct: 49   # внутр. ширина короба = внутр. ширина корпуса - 49 (ПРОВЕРИТЬ по схеме Muller)
drawer_bottom_recess: 13
drawer_bottom_box_h: 200
drawer_top_box_h: 130     # под чашей умывальника

# --- Сифон ----------------------------------------------------------------------
siphon_clearance: 50
u_width: 200

# --- Присадка: конфирмат 7x50 -------------------------------------------------
conf_face_d: 7
conf_edge_d: 5
conf_edge_depth: 35

# --- Материалы ВіЯр -----------------------------------------------------------
one_sided: true           # декор с одной стороны: боковины зеркальные, лицо наружу
facades_in_cut: true      # фасады режутся из того же листа и входят в файл ViyarPro
corpus_band: BG           # все торцы корпуса и фасадов в кромке
sheets:
  corpus:
    title: "Корпус и фасады — МДФ Acrylux, односторонний"
    name: "Панель МДФ NIEMANN 8859HM Acrylux-MAT (AFP) PREMIUM Античне золото \\ Білий РР 2800х1300х18мм (код 235316)"
    length: 2800
    width: 1300
    thickness: 18
  box:
    name: "ДСП Kronospan 7045 SU Шампань/Сатин 2800x2070x18 мм (код 31583)"
    length: 2800
    width: 2070
    thickness: 18
bands:
  BG:  {name: "8859HM Крайка ABS Античне золото 23х1мм NIEMANN матова, код 186180 (корпус и фасады)", thickness: 1, width: 23}
  B2:  {name: "94564 Крайка ABS Шампань 23х2мм REHAU, код 14448 (видимые торцы коробов)", thickness: 2, width: 23}
  B08: {name: "94564 Крайка ABS Шампань 23х0,8мм REHAU, код 87208 (остальные торцы коробов)", thickness: 0.8, width: 23}

corpus_notes:
  - "**Все торцы** корпуса и фасадов — в кромке ABS 1 мм «Античне золото». МДФ Acrylux **не влагостойкий**: кромка по всем сторонам и силикон под умывальником обязательны."
  - "Материал **односторонний** (изнанка белая): боковины K1Л/K1П — декором наружу (они зеркальные), дно K2 — декором вниз, фасады — наружу. Текстура «зліва направо» — у всех деталей вдоль длины (горизонтально)."
assembly_step0: "0. Декор (золото) — наружу. На конфирматы в боковинах — заглушки в цвет (золото матовое)."
